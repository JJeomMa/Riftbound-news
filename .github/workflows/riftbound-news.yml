name: Riftbound News Watcher

on:
  schedule:
    - cron: "*/15 * * * *"   # 15분마다 실행 (GitHub 사정상 다소 지연될 수 있음)
  workflow_dispatch: {}       # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write

jobs:
  check-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Check for new Riftbound news
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/check_riftbound_news.py

      - name: Commit updated seen list
        run: |
          git config user.name "riftbound-news-bot"
          git config user.email "actions@github.com"
          git add data/seen_news.json
          git diff --cached --quiet || git commit -m "Update seen news list [skip ci]"
          git push
